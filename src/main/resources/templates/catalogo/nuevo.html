<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Producto')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex justify-content-center" style="max-width: 1200px;">
        <div class="col-12 col-lg-8">
            <div class="card-retro p-4 p-md-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3" style="border-bottom: 1px solid var(--border-hairline);">
                    <div>
                        <h1 class="h5 fw-medium text-light mb-1">Publicar producto musical</h1>
                        <p class="text-secondary small mb-0">Alta de inventario para discográficas y administración</p>
                    </div>
                    <a th:href="@{/catalogo}" class="btn-retro-secondary" style="padding: 6px 12px; font-size: 0.8125rem;">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <form th:action="@{/catalogo/nuevo}" th:object="${producto}" method="post">
                    <div class="row g-3">
                        <!-- SKU -->
                        <div class="col-md-6">
                            <label for="sku" class="form-label-retro">Código SKU</label>
                            <input type="text" id="sku" th:field="*{sku}" 
                                   class="form-control form-control-retro meta-mono" th:errorclass="is-invalid" 
                                   placeholder="VIN-ABBEY-001" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
                        </div>

                        <!-- Formato -->
                        <div class="col-md-6">
                            <label for="formato" class="form-label-retro">Formato físico</label>
                            <select id="formato" th:field="*{formato}" class="form-select form-select-retro" th:errorclass="is-invalid" required>
                                <option value="" disabled selected>Selecciona un formato</option>
                                <option value="VINILO">Vinilo (LP / Single)</option>
                                <option value="CASSETTE">Cassette magnético</option>
                                <option value="CD">Disco compacto (CD Audio)</option>
                                <option value="EQUIPO_SONIDO">Equipo de sonido o tornamesa</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('formato')}" th:errors="*{formato}"></div>
                        </div>

                        <!-- Título -->
                        <div class="col-12">
                            <label for="titulo" class="form-label-retro">Título de la obra o dispositivo</label>
                            <input type="text" id="titulo" th:field="*{titulo}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="The Dark Side of the Moon — Pink Floyd" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                        </div>

                        <!-- Precio Venta -->
                        <div class="col-md-4">
                            <label for="precio_venta" class="form-label-retro">Precio de venta ($ USD)</label>
                            <div class="input-group">
                                <span class="input-group-text-retro">$</span>
                                <input type="number" step="0.01" min="0" id="precio_venta" th:field="*{precio_venta}" 
                                       class="form-control form-control-retro tabular-nums" th:errorclass="is-invalid" 
                                       placeholder="29.90" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('precio_venta')}" th:errors="*{precio_venta}"></div>
                        </div>

                        <!-- Precio Alquiler Diario -->
                        <div class="col-md-4">
                            <label for="precio_alquiler_dia" class="form-label-retro">Alquiler por día ($ USD)</label>
                            <div class="input-group">
                                <span class="input-group-text-retro">$</span>
                                <input type="number" step="0.01" min="0" id="precio_alquiler_dia" th:field="*{precio_alquiler_dia}" 
                                       class="form-control form-control-retro tabular-nums" th:errorclass="is-invalid" 
                                       placeholder="3.50" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('precio_alquiler_dia')}" th:errors="*{precio_alquiler_dia}"></div>
                        </div>

                        <!-- Stock -->
                        <div class="col-md-4">
                            <label for="stock" class="form-label-retro">Unidades disponibles</label>
                            <div class="input-group">
                                <span class="input-group-text-retro"><i class="bi bi-box-seam"></i></span>
                                <input type="number" min="0" id="stock" th:field="*{stock}" 
                                       class="form-control form-control-retro tabular-nums" th:errorclass="is-invalid" 
                                       placeholder="10" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                        </div>

                        <!-- Spotify Album ID -->
                        <div class="col-12">
                            <label for="spotify_album_id" class="form-label-retro">Identificador Spotify (Opcional)</label>
                            <div class="input-group">
                                <span class="input-group-text-retro"><i class="bi bi-spotify"></i></span>
                                <input type="text" id="spotify_album_id" th:field="*{spotify_album_id}" 
                                       class="form-control form-control-retro meta-mono" 
                                       placeholder="0ETFjACtuP2ADo6LFhL6HN">
                            </div>
                            <small class="meta-mono mt-1 d-block">Genera la vista previa interactiva en la tarjeta del catálogo.</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end align-items-center gap-2 mt-4 pt-3" style="border-top: 1px solid var(--border-hairline);">
                        <a th:href="@{/catalogo}" class="btn-retro-secondary">Cancelar</a>
                        <button type="submit" class="btn-retro-primary">
                            <i class="bi bi-check2"></i> Publicar producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
