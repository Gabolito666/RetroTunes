<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center" style="max-width: 1200px;">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card-retro p-4 p-md-4">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-2" style="font-size: 1.5rem;">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <h1 class="h5 fw-medium text-light mb-1">Crear cuenta</h1>
                    <p class="text-secondary small mb-0">Regístrate para comprar, alquilar y gestionar piezas de colección</p>
                </div>

                <form th:action="@{/registro}" th:object="${usuario}" method="post">
                    <!-- Nombre Completo -->
                    <div class="mb-3">
                        <label for="nombre_completo" class="form-label-retro">Nombre completo</label>
                        <div class="input-group">
                            <span class="input-group-text-retro"><i class="bi bi-person"></i></span>
                            <input type="text" id="nombre_completo" th:field="*{nombre_completo}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="Ej: Miles Davis" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre_completo')}" th:errors="*{nombre_completo}"></div>
                    </div>

                    <!-- Correo -->
                    <div class="mb-3">
                        <label for="correo" class="form-label-retro">Correo electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text-retro"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="correo" th:field="*{correo}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="nombre@correo.com" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <!-- Clave -->
                    <div class="mb-3">
                        <label for="clave_usuario" class="form-label-retro">Clave de seguridad (mínimo 6 caracteres)</label>
                        <div class="input-group">
                            <span class="input-group-text-retro"><i class="bi bi-lock"></i></span>
                            <input type="password" id="clave_usuario" th:field="*{clave_usuario}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="••••••••" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('clave_usuario')}" th:errors="*{clave_usuario}"></div>
                    </div>

                    <!-- Teléfono -->
                    <div class="mb-4">
                        <label for="telefono" class="form-label-retro">Teléfono de contacto</label>
                        <div class="input-group">
                            <span class="input-group-text-retro"><i class="bi bi-telephone"></i></span>
                            <input type="text" id="telefono" th:field="*{telefono}" 
                                   class="form-control form-control-retro" 
                                   placeholder="+57 300 000 0000">
                        </div>
                    </div>

                    <button type="submit" class="btn-retro-primary w-100" style="min-height: 40px;">
                        Completar registro
                    </button>
                </form>

                <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-hairline);">
                    <p class="text-secondary small mb-0">¿Ya tienes cuenta registrada? 
                        <a th:href="@{/login}" class="text-warning text-decoration-none">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
