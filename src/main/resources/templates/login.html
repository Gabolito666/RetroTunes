<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center" style="max-width: 1200px;">
        <div class="col-12 col-md-7 col-lg-5 col-xl-4">
            <div class="card-retro p-4 p-md-4">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-2" style="font-size: 1.5rem;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h1 class="h5 fw-medium text-light mb-1">Iniciar sesión</h1>
                    <p class="text-secondary small mb-0">Accede a tu cuenta para gestionar pedidos y colecciones</p>
                </div>

                <!-- Alertas con tonos semánticos discretos -->
                <div th:if="${mensajeError}" class="alert-retro-danger mb-3 d-flex align-items-center justify-content-between" role="alert">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:text="${mensajeError}"></span>
                    </div>
                    <button type="button" class="btn-close btn-close-white small" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div th:if="${mensajeExito}" class="alert-retro-success mb-3 d-flex align-items-center justify-content-between" role="alert">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="${mensajeExito}"></span>
                    </div>
                    <button type="button" class="btn-close btn-close-white small" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="correo" class="form-label-retro">Correo electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text-retro"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="correo" name="correo" class="form-control form-control-retro" 
                                   th:value="${correoIngresado}" placeholder="nombre@correo.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="clave" class="form-label-retro">Clave de seguridad</label>
                        <div class="input-group">
                            <span class="input-group-text-retro"><i class="bi bi-lock"></i></span>
                            <input type="password" id="clave" name="clave" class="form-control form-control-retro" 
                                   placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-retro-primary w-100" style="min-height: 40px;">
                        Iniciar sesión
                    </button>
                </form>

                <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-hairline);">
                    <p class="text-secondary small mb-0">¿Aún no tienes cuenta? 
                        <a th:href="@{/registro}" class="text-warning text-decoration-none">Regístrate</a>
                    </p>
                </div>

                <!-- Credenciales semilla para prueba rápida (estilo sobrio mono) -->
                <div class="mt-3 p-2 text-center meta-mono" style="background-color: var(--surface-deep); border-radius: var(--radius-control); border: 1px solid var(--border-hairline);">
                    Admin de prueba: admin@retrotunes.com • admin123
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
