# Configuración de Servidor
server.port=${PORT:8080}

# Persistencia Supabase PostgreSQL (IPv4 Pooler compatible con redes locales y remotas)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.zzjmcspwmtxqzxvnhhwv}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sopVVYBZL2EfqD0y}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optimización HikariCP para Supabase Pooler (Límite max 15 conexiones)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# Límite de carga de archivos (Fotografías de equipos físicos)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Credenciales Spotify Web API (Client Credentials Flow)
spotify.client.id=${SPOTIFY_CLIENT_ID:570906b52a5045be92af9f8d0e0c2461}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:9080a1317d6a4a1da86b0590af37e39e}
