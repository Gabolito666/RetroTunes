<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Producto')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card card-retro p-4 p-md-5 shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
                    <div>
                        <h2 class="h3 fw-bold brand-retro mb-1">Publicar Producto Musical</h2>
                        <p class="text-muted small mb-0">Gestión de inventario para Administradores y Discográficas</p>
                    </div>
                    <a th:href="@{/catalogo}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Volver al Catálogo
                    </a>
                </div>

                <form th:action="@{/catalogo/nuevo}" th:object="${producto}" method="post">
                    <div class="row g-3">
                        <!-- SKU -->
                        <div class="col-md-6">
                            <label for="sku" class="form-label form-label-retro">Código SKU (Identificador Único)</label>
                            <input type="text" id="sku" th:field="*{sku}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="Ej: VIN-ABBEY-001" required>
                            <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
                        </div>

                        <!-- Formato -->
                        <div class="col-md-6">
                            <label for="formato" class="form-label form-label-retro">Formato Físico</label>
                            <select id="formato" th:field="*{formato}" class="form-select form-select-retro" th:errorclass="is-invalid" required>
                                <option value="" disabled selected>Selecciona un formato</option>
                                <option value="VINILO">Vinilo (LP / Single)</option>
                                <option value="CASSETTE">Cassette de Cinta Magnética</option>
                                <option value="CD">Compact Disc (CD Audio)</option>
                                <option value="EQUIPO_SONIDO">Equipo de Sonido / Tornamesa</option>
                            </select>
                            <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('formato')}" th:errors="*{formato}"></div>
                        </div>

                        <!-- Título -->
                        <div class="col-12">
                            <label for="titulo" class="form-label form-label-retro">Título del Álbum o Nombre del Equipo</label>
                            <input type="text" id="titulo" th:field="*{titulo}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="Ej: The Dark Side of the Moon - Pink Floyd" required>
                            <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                        </div>

                        <!-- Precio Venta -->
                        <div class="col-md-4">
                            <label for="precio_venta" class="form-label form-label-retro">Precio de Venta ($ USD)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-light">$</span>
                                <input type="number" step="0.01" min="0" id="precio_venta" th:field="*{precio_venta}" 
                                       class="form-control form-control-retro" th:errorclass="is-invalid" 
                                       placeholder="29.99" required>
                            </div>
                            <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('precio_venta')}" th:errors="*{precio_venta}"></div>
                        </div>

                        <!-- Precio Alquiler Diario -->
                        <div class="col-md-4">
                            <label for="precio_alquiler_dia" class="form-label form-label-retro">Alquiler / Día ($ USD)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-light">$</span>
                                <input type="number" step="0.01" min="0" id="precio_alquiler_dia" th:field="*{precio_alquiler_dia}" 
                                       class="form-control form-control-retro" th:errorclass="is-invalid" 
                                       placeholder="3.50" required>
                            </div>
                            <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('precio_alquiler_dia')}" th:errors="*{precio_alquiler_dia}"></div>
                        </div>

                        <!-- Stock -->
                        <div class="col-md-4">
                            <label for="stock" class="form-label form-label-retro">Unidades en Stock</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-box-seam"></i></span>
                                <input type="number" min="0" id="stock" th:field="*{stock}" 
                                       class="form-control form-control-retro" th:errorclass="is-invalid" 
                                       placeholder="10" required>
                            </div>
                            <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                        </div>

                        <!-- Spotify Album ID -->
                        <div class="col-12">
                            <label for="spotify_album_id" class="form-label form-label-retro">ID de Álbum en Spotify (Opcional)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-success"><i class="bi bi-spotify"></i></span>
                                <input type="text" id="spotify_album_id" th:field="*{spotify_album_id}" 
                                       class="form-control form-control-retro" 
                                       placeholder="Ej: 0ETFjACtuP2ADo6LFhL6HN (22 caracteres alfanuméricos)">
                            </div>
                            <small class="text-secondary">Permite integrar el reproductor de vista previa en la tarjeta del producto.</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top border-secondary">
                        <a th:href="@{/catalogo}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-retro-primary px-4">
                            <i class="bi bi-check2-circle me-1"></i> Guardar en Supabase
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
