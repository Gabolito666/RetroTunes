<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card card-retro p-4 p-md-5 shadow-lg">
                <div class="text-center mb-4">
                    <span class="fs-1">🎙️</span>
                    <h2 class="h3 fw-bold brand-retro mt-2">Acceso a RetroTunes</h2>
                    <p class="text-muted small">Ingresa tus credenciales para administrar o disfrutar de tu música</p>
                </div>

                <!-- Alertas -->
                <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${mensajeError}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${mensajeExito}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="correo" class="form-label form-label-retro">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="correo" name="correo" class="form-control form-control-retro" 
                                   th:value="${correoIngresado}" placeholder="ejemplo@retrotunes.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="clave" class="form-label form-label-retro">Clave de Seguridad</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-lock"></i></span>
                            <input type="password" id="clave" name="clave" class="form-control form-control-retro" 
                                   placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-retro-primary w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary">
                    <p class="text-muted small mb-0">¿Aún no tienes cuenta? 
                        <a th:href="@{/registro}" class="text-warning text-decoration-none fw-bold">Regístrate aquí</a>
                    </p>
                </div>

                <!-- Credenciales semilla para prueba rápida -->
                <div class="mt-4 p-3 bg-dark rounded border border-secondary text-center small text-secondary">
                    <i class="bi bi-info-circle text-warning"></i> <strong>Admin por defecto:</strong> admin@retrotunes.com | clave: admin123
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
