<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | RetroTunes'">RetroTunes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos Custom RetroTunes -->
    <link rel="stylesheet" th:href="@{/css/retrotunes.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-retro sticky-top">
        <div class="container">
            <a class="navbar-brand brand-retro d-flex align-items-center" th:href="@{/}">
                <span class="vinyl-icon">📻</span> RetroTunes
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/catalogo}">
                            <i class="bi bi-disc"></i> Catálogo Musical
                        </a>
                    </li>
                    <li class="nav-item" th:if="${session.usuarioLogueado != null and (session.usuarioLogueado.rol.nombre_rol == 'ADMIN' or session.usuarioLogueado.rol.nombre_rol == 'DISCOGRAFICA')}">
                        <a class="nav-link text-warning fw-bold" th:href="@{/catalogo/nuevo}">
                            <i class="bi bi-plus-circle"></i> Nuevo Producto
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <!-- Si hay usuario autenticado -->
                    <div th:if="${session.usuarioLogueado != null}" class="d-flex align-items-center gap-3">
                        <span class="badge bg-secondary badge-rol">
                            <i class="bi bi-person-badge"></i>
                            <span th:text="${session.usuarioLogueado.rol.nombre_rol}">CLIENTE</span>
                        </span>
                        <span class="text-light small d-none d-md-inline" th:text="${session.usuarioLogueado.nombre_completo}">Usuario</span>
                        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </a>
                    </div>

                    <!-- Si es invitado -->
                    <div th:if="${session.usuarioLogueado == null}" class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn btn-retro-secondary btn-sm">
                            <i class="bi bi-box-arrow-in-right"></i> Ingresar
                        </a>
                        <a th:href="@{/registro}" class="btn btn-retro-primary btn-sm">
                            <i class="bi bi-person-plus"></i> Registrarse
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1 text-muted">© 2026 <strong>RetroTunes</strong>. Plataforma Relacional de Vinilos, Cassettes y Equipos Vintage.</p>
            <small class="text-secondary">Desarrollado bajo arquitectura SDD (Sprint 1) • Supabase PostgreSQL • Spring Boot</small>
        </div>
        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/main.js}"></script>
    </footer>

</body>
</html>
