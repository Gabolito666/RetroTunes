<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — RetroTunes'">RetroTunes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts Inter (Pesos controlados 400, 500, 600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Estilos Custom RetroTunes (Warm Ramp) -->
    <link rel="stylesheet" th:href="@{/css/retrotunes.css}">
</head>
<body>

    <!-- Navbar Fragment (Quiet Chrome) -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-retro sticky-top">
        <div class="container" style="max-width: 1200px;">
            <a class="navbar-brand brand-retro" th:href="@{/}">
                <span class="brand-icon"><i class="bi bi-disc"></i></span>
                <span>RetroTunes</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-label="Navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/catalogo}">
                            <i class="bi bi-collection me-1"></i> Catálogo
                        </a>
                    </li>
                    <li class="nav-item" th:if="${session.usuarioLogueado != null and (session.usuarioLogueado.rol.nombre_rol == 'ADMIN' or session.usuarioLogueado.rol.nombre_rol == 'DISCOGRAFICA')}">
                        <a class="nav-link text-warning" th:href="@{/catalogo/nuevo}">
                            <i class="bi bi-plus-circle me-1"></i> Publicar producto
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <!-- Si hay usuario autenticado -->
                    <div th:if="${session.usuarioLogueado != null}" class="d-flex align-items-center gap-3">
                        <span class="badge-rol">
                            <span th:text="${session.usuarioLogueado.rol.nombre_rol}">CLIENTE</span>
                        </span>
                        <span class="small text-secondary d-none d-md-inline" th:text="${session.usuarioLogueado.nombre_completo}">Usuario</span>
                        <a th:href="@{/logout}" class="btn-retro-ghost text-danger">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </a>
                    </div>

                    <!-- Si es invitado -->
                    <div th:if="${session.usuarioLogueado == null}" class="d-flex align-items-center gap-2">
                        <a th:href="@{/login}" class="btn-retro-secondary">
                            Ingresar
                        </a>
                        <a th:href="@{/registro}" class="btn-retro-primary">
                            Registrarse
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment (Restrained & Honest) -->
    <footer th:fragment="footer" class="footer-retro">
        <div class="container text-center" style="max-width: 1200px;">
            <p class="mb-1 text-secondary small">© 2026 <strong>RetroTunes</strong>. Tienda y archivo musical de audio analógico.</p>
            <small class="meta-mono">Vinilos prensados en 180g • Cintas magnéticas • Equipos acústicos calibrados</small>
        </div>
        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/main.js}"></script>
    </footer>

</body>
</html>
