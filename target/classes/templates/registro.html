<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de Usuario')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card card-retro p-4 p-md-5 shadow-lg">
                <div class="text-center mb-4">
                    <span class="fs-1">🎵</span>
                    <h2 class="h3 fw-bold brand-retro mt-2">Crear Cuenta RetroTunes</h2>
                    <p class="text-muted small">Regístrate como Cliente para acceder a compras, alquileres y colecciones</p>
                </div>

                <form th:action="@{/registro}" th:object="${usuario}" method="post">
                    <!-- Nombre Completo -->
                    <div class="mb-3">
                        <label for="nombre_completo" class="form-label form-label-retro">Nombre Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-person"></i></span>
                            <input type="text" id="nombre_completo" th:field="*{nombre_completo}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="Ej: John Doe" required>
                        </div>
                        <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('nombre_completo')}" th:errors="*{nombre_completo}"></div>
                    </div>

                    <!-- Correo -->
                    <div class="mb-3">
                        <label for="correo" class="form-label form-label-retro">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="correo" th:field="*{correo}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="nombre@ejemplo.com" required>
                        </div>
                        <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <!-- Clave -->
                    <div class="mb-3">
                        <label for="clave_usuario" class="form-label form-label-retro">Clave de Seguridad (mínimo 6 caracteres)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-lock"></i></span>
                            <input type="password" id="clave_usuario" th:field="*{clave_usuario}" 
                                   class="form-control form-control-retro" th:errorclass="is-invalid" 
                                   placeholder="••••••••" required>
                        </div>
                        <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('clave_usuario')}" th:errors="*{clave_usuario}"></div>
                    </div>

                    <!-- Teléfono -->
                    <div class="mb-4">
                        <label for="telefono" class="form-label form-label-retro">Teléfono de Contacto</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-telephone"></i></span>
                            <input type="text" id="telefono" th:field="*{telefono}" 
                                   class="form-control form-control-retro" 
                                   placeholder="+57 300 123 4567">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-retro-primary w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-person-check me-1"></i> Completar Registro
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary">
                    <p class="text-muted small mb-0">¿Ya tienes una cuenta registrada? 
                        <a th:href="@{/login}" class="text-warning text-decoration-none fw-bold">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
